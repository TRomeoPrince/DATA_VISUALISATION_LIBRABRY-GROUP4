name: C++ Build, Tests and Graph Examples

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build --parallel
      - name: Run all module and integration tests
        run: ctest --test-dir build --output-on-failure
      - name: Run the three graph examples and the full-library example
        working-directory: build
        run: |
          ./histogram_example
          ./kdeplot_example
          ./countplot_example
          ./complete_library_example
          test -s ../data/output/histogram_example.svg
          test -s ../data/output/kdeplot_example.svg
          test -s ../data/output/countplot_example.svg
          test -s ../data/output/complete_histogram.svg
          test -s ../data/output/complete_kdeplot.svg
          test -s ../data/output/complete_countplot.svg

  windows-native-ui:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Configure portable Windows C++ application
        run: cmake -S . -B build -DDATAVIZ_PORTABLE_UI=ON
      - name: Compile release executable and library
        run: cmake --build build --config Release --parallel
      - name: Run all library tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Package downloadable Windows ZIP and check portability
        shell: pwsh
        run: |
          $exe = @("build/Release/GraphStudio.exe", "build/GraphStudio.exe") |
            Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $exe) { throw "GraphStudio.exe was not built." }

          $package = "dist/GraphStudio"
          New-Item -ItemType Directory -Force "$package/data/input" | Out-Null
          New-Item -ItemType Directory -Force "$package/data/output" | Out-Null
          Copy-Item $exe "$package/GraphStudio.exe"
          Copy-Item "data/input/*.csv" "$package/data/input/"
          Set-Content "$package/START_HERE.txt" -Encoding UTF8 -Value @(
            "Group 4 Graph Studio - Windows x64"
            ""
            "1. Extract the ZIP into a normal folder such as Downloads or Documents."
            "2. Double-click GraphStudio.exe to open the native C++ GUI."
            "3. Pick a CSV, choose the graph, then click Generate SVG Graph."
            "4. Graph files are saved next to the EXE in data/output/."
            ""
            "Windows may ask you to confirm a downloaded unsigned app."
            "Only run files you trust. No Python or terminal is required."
          )
          Compress-Archive -Path "dist/GraphStudio" -DestinationPath "dist/GraphStudio-Windows-x64.zip" -Force

          # An automated, headless check of the EXTRACTED executable.
          # Running from another working directory catches hard-coded paths.
          $unpacked = Join-Path $env:RUNNER_TEMP "group4-portability-check"
          Expand-Archive "dist/GraphStudio-Windows-x64.zip" $unpacked -Force
          $portableExe = Join-Path $unpacked "GraphStudio/GraphStudio.exe"
          $process = Start-Process -FilePath $portableExe -ArgumentList "--self-test" -Wait -PassThru -WorkingDirectory $env:RUNNER_TEMP
          if ($process.ExitCode -ne 0) { throw "Portable Graph Studio self-test failed (exit $($process.ExitCode))." }
          $svgPath = Join-Path $unpacked "GraphStudio/data/output/portable_smoke.svg"
          if (-not (Test-Path $svgPath)) { throw "The portable application did not generate an SVG." }
          if ((Get-Item $svgPath).Length -eq 0) { throw "Generated SVG is empty." }
      - name: Attach portable Graph Studio ZIP to workflow run
        uses: actions/upload-artifact@v4
        with:
          name: GraphStudio-Windows-x64
          path: dist/GraphStudio-Windows-x64.zip
          if-no-files-found: error
      - name: Publish downloadable GitHub Release for version tags
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$env:GITHUB_REF_NAME" "dist/GraphStudio-Windows-x64.zip" --title "Group 4 Graph Studio $env:GITHUB_REF_NAME" --generate-notes
